name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unsaid
          POSTGRES_PASSWORD: unsaid_local_dev
          POSTGRES_DB: unsaid
        ports: ['54332:5432']
        options: >-
          --health-cmd "pg_isready -U unsaid -d unsaid"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blueprint §20.3. A dependency advisory is the one class of flaw that
      # appears without anyone changing a line of our code, so this gate has to
      # run on every build rather than being reviewed occasionally.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      # RustFS stands in for R2; both speak the same S3 API. MinIO's images
      # were withdrawn from every public registry, which is why this is not
      # the MinIO the local compose file names. A new bucket is private.
      - name: Start object storage
        env:
          AWS_ACCESS_KEY_ID: unsaid_dev
          AWS_SECRET_ACCESS_KEY: unsaid_local_dev
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name s3 -p 9010:9000 \
            -e RUSTFS_ACCESS_KEY=unsaid_dev -e RUSTFS_SECRET_KEY=unsaid_local_dev \
            rustfs/rustfs:1.0.1
          until aws --endpoint-url http://localhost:9010 s3api list-buckets >/dev/null 2>&1; do sleep 1; done
          aws --endpoint-url http://localhost:9010 s3api create-bucket --bucket unsaid-private
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9010/unsaid-private/)" = 403

      - name: Configure environment
        run: |
          cp .env.example .env
          cp .env.example backend/api/.env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 48)|" .env backend/api/.env

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @unsaid/api db:migrate
      - run: pnpm test

  # Blueprint §21.3: the privacy regression gate. A build that leaks a plaintext
  # marker into logs, the database or object storage fails here, before release.
  privacy-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # A .gitignore is a convention with no enforcement, and a pattern that
      # silently fails to match leaves no trace until the push has happened.
      # This inspects content, so a renamed secret is still caught.
      - name: Scan the tree for secrets
        run: node scripts/scan-secrets.mjs --all

      - name: Assert no content columns were introduced
        run: |
          if grep -nE "^\s+(title|body|text|transcript|content|tags|mood)\s*:" \
             backend/api/src/db/schema.ts; then
            echo "::error::A content-shaped column was added to the schema."
            echo "Emotional content must never reach Postgres in readable form."
            exit 1
          fi
          echo "No content-shaped columns in the schema."

      # The crisis numbers must have been dialled by a human before launch.
      # This stays failing until someone sets verifiedOn, which is the point.
      - name: Warn on unverified crisis resources
        continue-on-error: true
        run: |
          if grep -q "verifiedOn: null" backend/api/src/lib/ai/crisis.ts; then
            echo "::warning::Crisis resources have not been verified by dialling them."
            echo "Set verifiedOn only after someone has actually called each number."
          fi

      - name: Assert no plaintext logging
        run: |
          if grep -rnE "log\.(info|warn|error|debug)\([^)]*\b(content|plaintext|transcript)\b" \
             backend/api/src --include="*.ts" | grep -v "logger.ts"; then
            echo "::error::A log statement references content."
            exit 1
          fi
          echo "No content references in log statements."

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the Solana program
        run: cargo check -p unsaid
