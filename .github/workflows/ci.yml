name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unsaid
          POSTGRES_PASSWORD: unsaid_local_dev
          POSTGRES_DB: unsaid
        ports: ['54332:5432']
        options: >-
          --health-cmd "pg_isready -U unsaid -d unsaid"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MinIO stands in for R2; both speak the same S3 API.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=unsaid_dev -e MINIO_ROOT_PASSWORD=unsaid_local_dev \
            minio/minio:latest server /data
          until curl -sf http://localhost:9010/minio/health/live; do sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://localhost:9010 unsaid_dev unsaid_local_dev &&
             mc mb --ignore-existing local/unsaid-private &&
             mc anonymous set none local/unsaid-private"

      - name: Configure environment
        run: |
          cp .env.example .env
          cp .env.example backend/api/.env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 48)|" .env backend/api/.env

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @unsaid/api db:migrate
      - run: pnpm test

  # Blueprint §21.3: the privacy regression gate. A build that leaks a plaintext
  # marker into logs, the database or object storage fails here, before release.
  privacy-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # A .gitignore is a convention with no enforcement, and a pattern that
      # silently fails to match leaves no trace until the push has happened.
      # This inspects content, so a renamed secret is still caught.
      - name: Scan the tree for secrets
        run: node scripts/scan-secrets.mjs --all

      - name: Assert no content columns were introduced
        run: |
          if grep -nE "^\s+(title|body|text|transcript|content|tags|mood)\s*:" \
             backend/api/src/db/schema.ts; then
            echo "::error::A content-shaped column was added to the schema."
            echo "Emotional content must never reach Postgres in readable form."
            exit 1
          fi
          echo "No content-shaped columns in the schema."

      - name: Assert no plaintext logging
        run: |
          if grep -rnE "log\.(info|warn|error|debug)\([^)]*\b(content|plaintext|transcript)\b" \
             backend/api/src --include="*.ts" | grep -v "logger.ts"; then
            echo "::error::A log statement references content."
            exit 1
          fi
          echo "No content references in log statements."

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the Solana program
        run: cargo check -p unsaid
