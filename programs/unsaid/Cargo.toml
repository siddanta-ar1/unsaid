[package]
name = "unsaid"
version = "0.1.0"
description = "Ownership, proof and permission records for UNSAID. Never content."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "unsaid"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
